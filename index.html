<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .text {
            color: #ffffff;
            font-size: 14px;
            letter-spacing: 2px;
            font-weight: 300;
            opacity: 0.85;
            pointer-events: none;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        #overlay span {
            color: #666666;
            font-size: 16px;
            font-weight: normal;
            text-transform: none;
            letter-spacing: normal;
            transition: color 0.3s ease;
        }

        #overlay:hover span {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startExperience()">
        <span>click</span>
    </div>

    <div class="text">cas</div>

    <!-- Hidden audio element for your .mp3 file -->
    <audio id="bgMusic" src="jaydes.mp3" loop preload="auto"></audio>

    <script>
        // Disable right-click context menu and inspection shortcuts
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if (
                e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
                (e.ctrlKey && e.keyCode === 85)
            ) {
                e.preventDefault();
                return false;
            }
        });

        let isPlaying = false;

        function startExperience() {
            if (isPlaying) return;
            isPlaying = true;

            // Smooth vanish animation for the overlay
            const overlay = document.getElementById('overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 800);

            // Play the .mp3 file
            const music = document.getElementById('bgMusic');
            music.play().catch(error => {
                console.log("Audio playback failed:", error);
            });
        }
    </script>
</body>
</html>
